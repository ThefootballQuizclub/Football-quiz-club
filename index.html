<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Quiz Club</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a12;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 24px 20px;
            text-align: center;
            background: #0b2619;
            border-bottom: 2px solid #18c76e;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #18c76e;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: #123d28;
            color: #18c76e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0 20px;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            color: #c8d5ce;
        }

        .play-button {
            display: inline-block;
            margin-top: 30px;
            padding: 16px 35px;
            background: #18c76e;
            color: #071a12;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
        }

        .play-button:hover {
            background: #25e580;
        }

        .levels {
            margin-top: 55px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level {
            padding: 10px 15px;
            background: #102d20;
            border-radius: 8px;
            color: #b8c9c0;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #718279;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            Football <span>Quiz Club</span>
        </div>
    </header>

    <main>

        <div class="badge">THE ULTIMATE FOOTBALL QUIZ</div>

        <h1>Can you reach 1%?</h1>

        <p>
            Test your football knowledge.
            Start with the easier questions and fight your way
            through increasingly difficult challenges.
        </p>

        <a href="#" class="play-button">
            PLAY THE QUIZ
        </a>

        <div class="levels">
            <div class="level">90%</div>
            <div class="level">80%</div>
            <div class="level">70%</div>
            <div class="level">50%</div>
            <div class="level">30%</div>
            <div class="level">10%</div>
            <div class="level">5%</div>
            <div class="level">1%</div>
        </div>

    </main>

    <footer>
        © 2026 Football Quiz Club
    </footer>

</body>
</html>
